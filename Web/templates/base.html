<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartFarm{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>智能农业监测系统</h1>
        <nav>
            <a href="/">仪表盘</a>
            <a href="/history">历史</a>
            <a href="/control">控制</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>更新时间: <span id="update-time">{{ data.update_time }}</span></p>
    </footer>
    <script src="/static/script.js"></script>
    {% block script %}{% endblock %}
</body>
</html>
