{% extends "base.html" %}
{% block title %}远程控制{% endblock %}
{% block content %}
<div class="control">
    <div class="control-group">
        <h3>灌溉模式</h3>
        <button class="btn" onclick="sendCmd('mode', 'AUTO')">自动</button>
        <button class="btn" onclick="sendCmd('mode', 'MANUAL')">手动</button>
    </div>
    <div class="control-group">
        <h3>水泵</h3>
        <button class="btn on" onclick="sendCmd('pump', 'ON')">开启</button>
        <button class="btn off" onclick="sendCmd('pump', 'OFF')">关闭</button>
    </div>
    <div class="control-group">
        <h3>风扇</h3>
        <button class="btn on" onclick="sendCmd('fan', 'ON')">开启</button>
        <button class="btn off" onclick="sendCmd('fan', 'OFF')">关闭</button>
    </div>
    <div class="control-group">
        <h3>窗户</h3>
        <button class="btn on" onclick="sendCmd('window', 'OPEN')">打开</button>
        <button class="btn off" onclick="sendCmd('window', 'CLOSE')">关闭</button>
    </div>
    <div class="control-group">
        <h3>阈值设置</h3>
        <label>低阈值: <input type="number" id="low" value="30" min="0" max="100"></label>
        <label>高阈值: <input type="number" id="high" value="70" min="0" max="100"></label>
        <button class="btn" onclick="setThreshold()">设置</button>
    </div>
    <div id="status"></div>
</div>
{% endblock %}
{% block script %}
<script>
function sendCmd(device, value) {
    fetch('/api/control/' + device, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({value: value})
    })
    .then(r => r.json())
    .then(d => {
        document.getElementById('status').textContent = '已发送: ' + d.message;
    });
}
function setThreshold() {
    const low = document.getElementById('low').value;
    const high = document.getElementById('high').value;
    fetch('/api/control/threshold', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({low: parseInt(low), high: parseInt(high)})
    })
    .then(r => r.json())
    .then(d => {
        document.getElementById('status').textContent = '阈值已设置: ' + d.message;
    });
}
</script>
{% endblock %}
